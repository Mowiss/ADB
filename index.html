<style>
/* Mise en page : interface à bord perdu. Volet latéral (Personnage · Décompte · Statistiques) à gauche,
   centre : état, fractures, mains, homme de Vitruve, puis cadres Inventaire et Cyber en vignettes.
   Ruban de bandes pastel resserrées en fond. Univers clair unique, assumé. */
:root{
  --paper:#ffffff; --wash:rgba(255,255,255,.86);
  --ink:#4b505e; --ink-strong:#2f3340; --ink-soft:#8d92a2; --rule:#d3d6de; --faint:#eceef2;
  --sepia:#4a3426;
  --b-yel:#f6d65a; --b-blu:#8ec3ec; --b-gre:#9fd59a; --b-red:#f49a92; --b-pin:#f3a2cf; --b-vio:#b5a1e1;
  --c-for:#c79600; --c-res:#2b79bd; --c-cha:#33964d; --c-sav:#d24c45; --c-dex:#c74990; --c-per:#7556c2;
  --danger:#e3262b; --gold:#d19c00; --ok:#2f9a55; --link:#2b79bd; --link-cyb:#7556c2;
  --f-title:"Josefin Sans","Century Gothic","Avenir Next",sans-serif;
  --f-body:"Quicksand","Nunito","Segoe UI",system-ui,sans-serif;
  --bar:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-body);font-size:14px;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-res);outline-offset:2px}
.booting .layout{visibility:hidden}

/* Ruban de bandes (fond fixe) */
.bands{position:absolute;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.ribbon{position:absolute;left:-25%;width:150%;top:var(--ry,60%);transform:translateY(-50%) rotate(-14deg);display:flex;flex-direction:column;gap:12px}
.band{height:60px;opacity:.26}

/* Barre d'appli */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;height:var(--bar);background:var(--wash);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:31;background:var(--paper)}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:8px;font-family:var(--f-title);letter-spacing:.32em;font-size:17px;color:var(--ink-strong);white-space:nowrap}
.brand .dot{width:8px;height:8px;border-radius:50%;background:var(--danger);display:inline-block}
.brand small{font-family:var(--f-body);letter-spacing:.08em;font-size:11px;color:var(--ink-soft);font-weight:600;text-transform:uppercase}
.tools{display:flex;gap:2px;align-items:center;min-width:0}
.tool{display:inline-flex;align-items:center;gap:6px;background:transparent;border:1px solid transparent;border-radius:8px;padding:6px 9px;font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap}
.tool:hover{border-color:var(--rule);background:var(--paper)}
.tool svg{width:18px;height:18px;flex:none}
.sep{width:1px;height:22px;background:var(--rule);margin:0 4px}
.savestate{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:6px;white-space:nowrap;margin-left:6px}
.savestate i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.savestate.dirty i{background:var(--gold)}
.spacer{flex:1}
.menu{position:relative}
.menu .chev{width:14px;height:14px;opacity:.6;transition:transform .15s}
.menu.open .chev{transform:rotate(180deg)}
.sdot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sdot.dirty{background:var(--gold)}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);min-width:250px;background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:6px;display:flex;flex-direction:column;z-index:50;box-shadow:0 10px 30px rgba(47,51,64,.12)}
.mi{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:8px 10px;font-size:13px;font-weight:600;color:var(--ink-strong);text-align:left;width:100%}
.mi:hover,.mi:focus-visible{background:var(--faint)}
.mi svg{width:17px;height:17px;flex:none;color:var(--ink)}
.mi kbd{margin-left:auto;font-family:var(--f-body);font-size:10.5px;color:var(--ink-soft);font-weight:600}
.msep{height:1px;background:var(--faint);margin:4px 2px}
.mstate{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-soft);padding:6px 10px 2px}
.mstate i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.mstate.dirty i{background:var(--gold)}
.mstate.sub{padding-top:0;padding-bottom:6px;padding-left:24px}
.tool.icon{padding:7px;position:relative}
.tool.icon .sdot{position:absolute;top:5px;right:5px;border:1.5px solid var(--paper);width:9px;height:9px}

@media (max-width:1180px){.tool .lbl{display:none}}
@media (max-width:560px){.brand small,.sep{display:none}.tool{padding:5px}.brand{letter-spacing:.14em;font-size:15px;margin-right:0}.appbar{gap:4px}.tool svg{width:17px;height:17px}}

/* Structure */
.layout{position:relative;z-index:1;display:grid;grid-template-columns:minmax(330px,370px) minmax(0,1fr);min-height:calc(100dvh - var(--bar))}
.panel{z-index:1;position:sticky;top:calc(var(--bar) + env(safe-area-inset-top,0px));align-self:start;max-height:calc(100dvh - var(--bar) - env(safe-area-inset-top,0px));overflow:auto;scrollbar-width:none;-ms-overflow-style:none;
  border-right:1px solid var(--rule);padding:14px 20px 28px max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.panel::-webkit-scrollbar{display:none}
.center{position:relative;z-index:1;min-width:0;padding:16px max(18px,env(safe-area-inset-right,0px)) 40px 26px;display:flex;flex-direction:column;gap:14px}
.blk{display:flex;flex-direction:column;gap:6px;padding-bottom:12px}
.blk + .blk{padding-top:4px}
.hr{height:1px;background:var(--rule)}

.ttl{display:block;width:100%;height:34px;overflow:visible}
.ttl text{font-family:var(--f-title);font-weight:300;font-size:24px;letter-spacing:.24em;fill:var(--ink);stroke:var(--ink);stroke-width:.7;stroke-opacity:0}
.ttl.sm{height:30px}.ttl.sm text{font-size:21px}
.cap{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}

/* Personnage */
.who{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center}
.portrait{width:84px;height:84px;border-radius:50%;border:1.4px solid var(--ink-soft);display:grid;place-items:center;overflow:hidden;background:var(--paper);cursor:pointer;padding:0}
.portrait img{width:100%;height:100%;object-fit:cover}
.portrait svg{width:32px;height:32px;color:var(--ink-soft)}
.field{display:flex;flex-direction:column;gap:1px;min-width:0}
.line-in{border:0;border-bottom:1px solid var(--rule);background:transparent;padding:4px 2px;min-width:0;width:100%;outline:none}
.line-in:focus{border-bottom-color:var(--ink)}
.name-in{font-family:var(--f-title);font-size:25px;letter-spacing:.05em;color:var(--ink-strong)}
.name-in::placeholder{color:#c3c6cf}
select.line-in{appearance:none;cursor:pointer;font-weight:600;background-image:linear-gradient(45deg,transparent 50%,var(--ink-soft) 50%),linear-gradient(-45deg,transparent 50%,var(--ink-soft) 50%);background-size:5px 5px;background-position:calc(100% - 9px) 55%,calc(100% - 4px) 55%;background-repeat:no-repeat;padding-right:18px}
.racial{font-size:12.5px;line-height:1.45;border-bottom:1px dashed var(--rule);padding:4px 2px}
.racial b{color:var(--ink-strong)}

/* Cadrans */
.dials{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0 4px}
.dial{position:relative;aspect-ratio:1/1;width:100%}
.dial > svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dial .ring{fill:none;stroke:var(--ink-soft);stroke-width:1.5}
.dial .arc-lbl{font-family:var(--f-body);font-size:11px;font-weight:600;letter-spacing:.05em;fill:var(--ink)}
.dial .ico{fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dial .center-v{position:absolute;left:20%;right:20%;top:24%;bottom:24%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.big{font-family:var(--f-title);font-size:26px;line-height:1;color:var(--ink-strong);font-variant-numeric:tabular-nums;white-space:nowrap}
.big small{font-size:.55em;color:var(--ink-soft)}
.pm{display:flex;gap:4px}
.pm button{width:21px;height:21px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;padding:0;font-weight:700;line-height:1}
.pm button:hover{border-color:var(--ink)}
.calc{font-size:9px;color:var(--ink-soft);letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.dial.alert .ring{stroke:var(--danger);stroke-width:2}
.dial.glow .ring{stroke:var(--gold);stroke-width:2.2}.dial.glow .big{color:var(--gold)}
.bastos{display:flex;align-items:baseline;gap:8px;order:9;margin-left:auto}
.bastos .cap{letter-spacing:.3em}
.bastos button{display:flex;align-items:baseline;gap:6px;background:none;border:0;border-bottom:1px solid var(--rule);padding:2px 4px;font-family:var(--f-title);font-size:23px;color:var(--ink-strong);font-variant-numeric:tabular-nums}
.bastos button:hover{border-bottom-color:var(--ink)}
.bastos button span{font-family:var(--f-body);font-size:15px;color:var(--gold);font-weight:700}
.statin{width:100%;border:0;border-bottom:1px dashed transparent;background:transparent;text-align:center;padding:0;outline:none;border-radius:0}
.statin:hover{border-bottom-color:var(--rule)}.statin:focus{border-bottom-color:var(--ink)}
.stat .eff,.stat.mod .statin{display:none}
.stat.mod .eff{display:block}
.rollb{width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;padding:0;color:var(--ink);margin-top:2px}
.rollb svg{width:14px;height:14px}.rollb:hover{border-color:var(--ink);background:var(--ink-strong);color:#fff}
.stat .base{display:none}
.stat.mod .base{display:grid}
.stat .base{position:absolute;left:0;top:58%;width:30%;aspect-ratio:1/1;border-radius:50%;border:1.3px solid var(--ink-soft);background:var(--paper);place-items:center}
.stat .base{display:none}
.stat.mod .base{display:grid;place-items:center}
.stat .base{gap:0}
.stat .base svg{width:62%;height:62%;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.stat .base.n2 svg{width:46%;height:46%}
.stat .base.n2{display:flex!important;align-items:center;justify-content:center}
.stat.mod .eff{cursor:text}
.stat.editing .eff{display:none}.stat.editing .statin{display:block}
.stat.malus .eff{color:var(--danger)}
.stat.bonus .eff{color:var(--ok)}
.note-line{font-size:12px;color:var(--ink-soft);border-bottom:1px dashed var(--rule);padding:3px 2px}

/* Centre : bandeau état / fractures / mains */
.blk-head{display:flex;align-items:center;gap:10px}
.blk-head .ttl{flex:1;min-width:0}
.sq-add{width:30px;height:30px;flex:none;border-radius:7px;border:0;background:var(--ink-strong);color:#fff;display:grid;place-items:center;padding:0}
.sq-add svg{width:16px;height:16px}
.sq-add:hover{background:#000}
.fx-tools{display:flex;gap:6px;flex-wrap:wrap}
.mini{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--ink-strong);background:var(--ink-strong);color:#fff;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700}
.mini svg{width:13px;height:13px}
.mini.ghost{background:transparent;color:var(--ink-strong);border-color:var(--rule)}
.fx-list{display:flex;flex-direction:column;gap:0;margin-top:2px}
#orbit{position:absolute;inset:0;pointer-events:none;z-index:3}
.bub{position:absolute;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:var(--paper);border:1.6px solid var(--c);display:grid;place-items:center;pointer-events:auto;cursor:help;transition:transform .15s,box-shadow .15s}
.bub svg{width:21px;height:21px;fill:none;stroke:var(--c);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.bub:hover,.bub:focus-visible{transform:scale(1.15);box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 5.5px var(--c);outline:none;z-index:2}
.bub-tip{position:absolute;left:calc(100% + 10px);top:50%;transform:translateY(-50%);width:230px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:9px 11px;display:none;flex-direction:column;gap:3px;font-size:12px;line-height:1.4;color:var(--ink);box-shadow:0 10px 26px rgba(47,51,64,.16);cursor:default;text-align:left}
.bub-tip::before{content:"";position:absolute;right:100%;top:0;bottom:0;width:12px}
.bub.tip-l .bub-tip{left:auto;right:calc(100% + 10px)}
.bub.tip-l .bub-tip::before{right:auto;left:100%}
.bub:hover .bub-tip,.bub:focus-within .bub-tip{display:flex}
.bub-tip b{font-size:13px;color:var(--ink-strong)}
.bub-tip .st{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--c)}
.bub-tip .bt{display:flex;gap:6px;margin-top:5px}
.shell{position:fixed;z-index:9999;width:9px;height:22px;pointer-events:none}
.shell svg{width:100%;height:100%;display:block}
.shell-cost{position:fixed;z-index:9999;pointer-events:none;font-family:var(--f-title);font-size:20px;font-weight:600;color:var(--danger);white-space:nowrap}
#bastos-val{display:inline-block}
.bub.add{background:var(--ink-strong);border-color:var(--ink-strong);cursor:pointer}
.bub.add svg{stroke:#fff;stroke-width:2.4}
.bub.add:hover{box-shadow:0 0 0 4px rgba(255,255,255,.9),0 0 0 5.5px var(--ink-strong)}
.fx{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:2px 10px;align-items:start;padding:8px 0;border-bottom:1px dashed var(--rule)}
.fx .dot{width:10px;height:10px;border-radius:50%;margin-top:4px}
.fx .nm{font-weight:700;color:var(--ink-strong);font-size:13px;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.fx .tg{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:999px;padding:1px 7px;border:1px solid currentColor}
.fx .tg.race{color:var(--gold)}
.fx .tg.buff{color:var(--ok)}.fx .tg.malus{color:var(--danger)}.fx .tg.etat{color:var(--ink-soft)}.fx .tg.auto{color:var(--c-res)}
.fx .ds{grid-column:2;font-size:12px;color:var(--ink-soft);line-height:1.4}
.fx .acts{display:flex;gap:4px;grid-row:1/3;grid-column:3}
.fx .turns{font-size:11.5px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;align-self:center;white-space:nowrap}
.fx-empty{font-size:12.5px;color:var(--ink-soft);padding:8px 0}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:34vh;overflow:auto}
.fxgrid button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;border:1px solid var(--rule);background:var(--paper);border-radius:9px;padding:8px 10px;text-align:left}
.fxgrid button:hover{border-color:var(--ink)}
.fxgrid b{font-size:12.5px;color:var(--ink-strong);display:flex;align-items:center;gap:6px}
.fxgrid .pi{width:17px;height:17px;flex:none;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fxgrid b i{width:8px;height:8px;border-radius:50%;display:inline-block}
.fxgrid span{font-size:11px;color:var(--ink-soft);line-height:1.3}
.fxform{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 14px}
.fxform .full{grid-column:1/-1}
.fxform label{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);display:flex;flex-direction:column;gap:3px}
.fxform input,.fxform select,.fxform textarea{border:0;border-bottom:1px solid var(--rule);background:transparent;padding:5px 2px;font-weight:600;font-size:13.5px;outline:none;text-transform:none;letter-spacing:0;color:var(--ink-strong)}
.fxform textarea{border:1px solid var(--rule);border-radius:7px;min-height:56px;resize:vertical;font-weight:500}
.fxform select{appearance:none}
.subttl{font-family:var(--f-title);font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-strong);margin:4px 0 -4px}
.status-row{display:flex;align-items:center;gap:8px}
.status-dot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}
.desc{font-size:12px;color:var(--ink-soft);line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:28px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--danger);color:var(--danger);border-radius:999px;padding:3px 6px 3px 10px;font-size:12px;font-weight:700;background:rgba(255,255,255,.9)}
.chip button{border:0;background:none;color:inherit;padding:0 2px;line-height:1;font-size:14px}
.hands-txt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:13px}
.hands-txt b{font-family:var(--f-title);letter-spacing:.1em;color:var(--ink-soft);font-weight:600}
.hands-txt span{font-weight:600;color:var(--ink-strong);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hands-txt span.empty{color:#b9bdc8;font-weight:500}

/* Homme de Vitruve */
.figure-wrap{position:relative;display:flex;justify-content:center;padding:0 190px;min-width:0}
#leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
#leads path{fill:none;stroke-width:1.4}
#leads circle{stroke:none}
#tags{position:absolute;inset:0;pointer-events:none}
.tagp{position:absolute;pointer-events:auto;display:flex;align-items:center;gap:6px;background:var(--paper);border:1.4px solid var(--c);border-radius:999px;padding:3px 4px 3px 11px;font-size:12px;font-weight:700;color:var(--ink-strong);white-space:nowrap;max-width:180px;height:28px;transform:translateY(-50%)}
.tagp span{overflow:hidden;text-overflow:ellipsis}
.tagp button{flex:none;height:20px;min-width:20px;border-radius:999px;border:0;display:grid;place-items:center;padding:0 6px;font-size:11px;font-weight:700}
.tagp .tr{background:var(--ink-strong);color:#fff;display:flex;gap:3px;align-items:center}
.tagp .tr svg{width:12px;height:12px}
.tagp .tx{background:var(--faint);color:var(--ink);font-size:14px;line-height:1;padding:0 5px}
.tagp .tx:hover{background:var(--danger);color:#fff}
.tagp.hi{box-shadow:0 0 0 3px rgba(43,121,189,.2)}
@media (max-width:1100px){.figure-wrap{padding:0;flex-direction:column;align-items:center;gap:10px}#leads{display:none}#tags{position:static;display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.tagp{position:static;transform:none}}
.figure{position:relative;width:min(100%,600px);aspect-ratio:910/990}
.figure svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.vit{fill:none;stroke:var(--ink-strong);stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.bone{fill:#e9ebf0;stroke:#b9bdc9;stroke-width:1.1;transition:fill .25s,stroke .25s}
.bone.open{fill:none}
.bone.hl{fill:#d7e7f5;stroke:var(--link)}
.bone.frac{fill:#ef5a62;stroke:#c2333b;stroke-width:1.2;animation:throb 1.8s ease-in-out infinite}
.bone.open.frac{fill:none;stroke:#e0444d;stroke-width:1.8}
@keyframes throb{0%,100%{filter:drop-shadow(0 0 0 rgba(226,60,70,0))}50%{filter:drop-shadow(0 0 4px rgba(226,60,70,.55))}}
@media (prefers-reduced-motion:reduce){.bone.frac{animation:none}}
.zone{fill:transparent;stroke:transparent;stroke-width:3;cursor:pointer;pointer-events:all;transition:fill .15s,stroke .15s}
.zone:hover,.zone.hl{fill:rgba(142,195,236,.28);stroke:var(--link);stroke-dasharray:8 6}
.zone.frac{fill:rgba(255,31,45,.06)}
.zone.frac:hover{fill:rgba(255,31,45,.12);stroke:var(--danger)}
.crack{pointer-events:none}
.crack circle{fill:var(--danger)}
.crack path{fill:none;stroke:#fff;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.badge{pointer-events:none}
.badge circle{fill:#fff;stroke-width:3}
.badge text{font-family:var(--f-body);font-weight:700;font-size:22px;text-anchor:middle;dominant-baseline:central}
.hand-lbl{font-family:var(--f-body);font-weight:700;font-size:21px;text-anchor:middle;fill:var(--ink-strong);paint-order:stroke;stroke:#fff;stroke-width:6}
.hand-lbl.empty{fill:#a8adb9;font-weight:600}
.zone-tip{position:absolute;display:none;pointer-events:none;background:var(--ink-strong);color:#fff;font-size:12px;font-weight:600;padding:5px 9px;border-radius:7px;white-space:nowrap;transform:translate(-50%,-130%);opacity:0;transition:opacity .12s}
.zone-tip.show{display:block;opacity:1}
.fig-hint{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:-6px}

/* Inventaire : une ligne par élément */
.frames{display:block}
.frame{display:flex;flex-direction:column;gap:8px;min-width:0}
.frame-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink-soft);padding-bottom:6px}
.frame-head .ttl{flex:0 0 auto;width:200px;min-width:0;align-self:flex-end}
.frame-meta{flex:1;min-width:0;font-size:12px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame-meta b{color:var(--ink-strong)}.frame-meta.over b{color:var(--danger)}
.frame-head .sq-add{order:10}
.invscroll{overflow-x:auto}
.rows{display:flex;flex-direction:column;min-width:960px}
.zc{appearance:none;min-width:0;width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:3px 1px;font-size:12px;font-weight:700;color:var(--link);cursor:pointer;outline:none}
.zc:focus{border-bottom-color:var(--ink)}
.row.cyb .zc{color:var(--link-cyb)}
.empty-frame{border:1px dashed var(--rule);border-radius:10px;padding:22px;text-align:center;color:var(--ink-soft);font-size:13px;background:rgba(255,255,255,.75)}
.row{display:grid;grid-template-columns:20px 30px minmax(130px,1.3fr) 100px 56px 42px 42px 42px 42px 42px 52px minmax(150px,2fr) 34px;column-gap:8px;align-items:center;min-height:42px;padding:3px 6px 3px 2px;background:rgba(255,255,255,.9);border-bottom:1px solid var(--faint);transition:background .15s,box-shadow .15s}
.row:not(.head):hover{background:rgba(142,195,236,.08)}
.row.head{min-height:30px;background:transparent;border-bottom:1px solid var(--rule)}
.row .h{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);display:flex;align-items:center;justify-content:center;gap:2px;white-space:nowrap}
.row .h.l{justify-content:flex-start}
.row .h svg{width:14px;height:14px}
.row.hi{box-shadow:inset 3px 0 0 var(--link)}
.row.cyb.hi{box-shadow:inset 3px 0 0 var(--link-cyb)}
.row.dragging{opacity:.45}
.grip{width:20px;height:30px;display:grid;place-items:center;cursor:grab;color:#b7bbc6;touch-action:none;border:0;background:none;padding:0}
.grip:hover{color:var(--ink)}
.grip svg{width:12px;height:18px}
.tico{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--faint);cursor:grab;touch-action:none;background:var(--paper)}
.tico svg{width:17px;height:17px}
.row .nm{min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;font-weight:700;color:var(--ink-strong);padding:3px 2px;outline:none;font-size:13.5px}
.row .nm:focus{border-bottom-color:var(--rule)}
.row.equipped .nm{color:var(--ink-strong)}
.tsel{appearance:none;border:0;background:none;padding:2px 0;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer;min-width:0;width:100%}
.tsel:hover{color:var(--ink)}
.c{min-width:0;width:100%;border:0;border-bottom:1px solid var(--rule);background:transparent;padding:3px 1px;font-weight:700;font-size:13px;outline:none;text-align:center;font-variant-numeric:tabular-nums}
select.c{appearance:none;cursor:pointer}
.c:focus{border-bottom-color:var(--ink)}
.c.na{border-bottom:1px dotted var(--faint);height:22px}
.row .ds{min-width:0;border:0;border-bottom:1px dashed var(--rule);background:transparent;font-size:12.5px;padding:3px 2px;outline:none;color:var(--ink)}
.row .ds:focus{border-bottom-color:var(--ink)}
.pill{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--ink)}
.pill.on{background:var(--c-res);border-color:var(--c-res);color:#fff}
.acts{display:flex;gap:4px;align-items:center;justify-content:flex-end}
.ib{width:28px;height:28px;border-radius:7px;border:1px solid var(--rule);background:var(--paper);display:grid;place-items:center;padding:0;color:var(--ink);flex:none}
.ib svg{width:14px;height:14px}
.ib:hover{border-color:var(--ink)}
.useb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink-strong);background:var(--ink-strong);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;font-size:12px;white-space:nowrap}
.useb svg{width:14px;height:14px}
.useb.off{background:transparent;color:var(--ink-soft);border-color:var(--rule);cursor:default}
.ghost-drag{position:fixed;z-index:200;pointer-events:none;display:flex;align-items:center;gap:8px;background:var(--ink-strong);color:#fff;border-radius:999px;padding:6px 12px 6px 8px;font-size:12.5px;font-weight:700;transform:translate(-50%,-140%);box-shadow:0 8px 24px rgba(47,51,64,.25);white-space:nowrap}
.ghost-drag svg{width:16px;height:16px}
.ghost-drag small{opacity:.7;font-weight:600}
.zone.drop{fill:rgba(43,121,189,.22)!important;stroke:var(--link)!important;stroke-dasharray:none!important}
.hand-t{fill:transparent;pointer-events:none}
.hand-t.drop{fill:rgba(43,121,189,.22);stroke:var(--link);stroke-width:3}
body.dragmode .hand-t{pointer-events:all}
.fistg{transition:opacity .2s}
.fistg .fo{fill:none;stroke:var(--ink-strong);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fistg .bone{stroke-linejoin:round}
.armor-line{fill:none;stroke:var(--c-res);stroke-width:6;stroke-linejoin:round;stroke-linecap:round;opacity:.8;pointer-events:none}
@media (max-width:820px){.frame-head{flex-wrap:wrap}.frame-head .ttl{width:100%}}

.layout.dead .center,.layout.dead .panel{filter:grayscale(1)}
.stamp{position:fixed;z-index:25;top:45%;left:calc(50% + 180px);transform:translate(-50%,-50%) rotate(-12deg);border:3px solid var(--danger);color:var(--danger);font-family:var(--f-title);font-size:44px;letter-spacing:.3em;padding:8px 22px;background:rgba(255,255,255,.8);pointer-events:none}

/* Dialogues */
dialog{border:1px solid var(--rule);border-radius:14px;padding:0;background:var(--paper);color:var(--ink);max-width:min(560px,calc(100vw - 32px));width:100%}
dialog::backdrop{background:rgba(47,51,64,.42)}
.dlg{padding:22px 24px;display:flex;flex-direction:column;gap:14px}
.dlg h3{margin:0;font-family:var(--f-title);font-weight:400;font-size:24px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-strong)}
.dlg p{margin:0;line-height:1.55}
.btn{border:1px solid var(--ink-strong);background:var(--ink-strong);color:var(--paper);border-radius:9px;padding:9px 16px;font-weight:700;font-size:13px}
.btn.ghost{background:transparent;color:var(--ink-strong);border-color:var(--rule)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.dlg .actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.typegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.typegrid button{display:flex;flex-direction:column;align-items:flex-start;gap:6px;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:12px;text-align:left}
.typegrid button:hover{border-color:var(--ink)}
.typegrid button svg{width:22px;height:22px}
.typegrid b{font-size:13.5px;color:var(--ink-strong)}
.typegrid span{font-size:11.5px;color:var(--ink-soft);line-height:1.35}
.dice{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:14px;border:1px solid var(--faint);border-radius:12px}
.die{width:46px;height:46px;border-radius:10px;border:1.5px solid var(--rule);display:grid;place-items:center;font-family:var(--f-title);font-size:22px;color:var(--ink-soft);font-variant-numeric:tabular-nums;animation:pop .35s both}
.die.ok{border-color:var(--ok);color:var(--ok);background:rgba(159,213,154,.25)}
.die.crit{border-color:var(--gold);color:#fff;background:var(--gold)}
.die.fail{border-color:var(--danger);color:var(--danger);background:rgba(244,154,146,.2)}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
.verdict{text-align:center;font-family:var(--f-title);font-size:34px;letter-spacing:.12em;color:var(--ink-strong)}
.verdict.win{color:var(--ok)}.verdict.lose{color:var(--danger)}
.meta{text-align:center;color:var(--ink-soft);font-size:13px}
.inst{display:flex;align-items:center;gap:14px;border:1px solid var(--rule);border-radius:10px;padding:12px 14px}
.inst div{flex:1;display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--ink-soft);line-height:1.4}
.inst b{color:var(--ink-strong);font-size:13.5px}
.btn:disabled{opacity:.5;cursor:default}
.kv{display:grid;grid-template-columns:1fr auto;gap:10px 16px;align-items:center}
.guide h4{margin:6px 0 0;font-family:var(--f-title);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--ink-strong)}
.guide p,.guide li{font-size:13.5px;line-height:1.55;max-width:65ch}
.guide ul{margin:0;padding-left:18px}
.guide{max-height:62vh;overflow:auto;padding-right:6px}

/* Journal */
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--paper);border-left:1px solid var(--rule);z-index:40;transform:translateX(102%);transition:transform .3s ease;display:flex;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) calc(18px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) 18px}
.drawer.open{transform:none}
.drawer header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.drawer h3{margin:0;font-family:var(--f-title);font-weight:300;letter-spacing:.24em;font-size:24px;text-transform:uppercase;color:var(--ink-strong)}
.roller{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px}
.rl-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.rl-f{display:flex;flex-direction:column;gap:4px;min-width:0}
.stepper{display:flex;align-items:center;border-bottom:1px solid var(--rule)}
.stepper input{flex:1;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--f-title);font-size:30px;color:var(--ink-strong);outline:none;padding:2px 0}
.stepper button{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--rule);background:var(--paper);font-weight:700;padding:0}
.stepper button:hover{border-color:var(--ink)}
#fr-out:empty{display:none}
#fr-out{display:flex;flex-direction:column;gap:8px}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:7px 0;border-bottom:1px dashed var(--rule);font-size:12.5px}
.hist .h b{color:var(--ink-strong)}
.hist .h .r{font-variant-numeric:tabular-nums;color:var(--ink-soft);font-size:11.5px;grid-column:1/-1;letter-spacing:.04em}
.hist .h .s{font-weight:700}.hist .h .s.win{color:var(--ok)}.hist .h .s.lose{color:var(--danger)}
.notes{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px}
.note{display:flex;flex-direction:column;gap:4px}
.note .top{display:flex;gap:6px;align-items:center}
.note input{font-weight:700;color:var(--ink-strong)}
.note textarea{border:1px solid var(--faint);border-radius:8px;padding:8px;min-height:96px;resize:vertical;background:repeating-linear-gradient(transparent 0 23px,var(--faint) 23px 24px);line-height:24px;outline:none}
.empty-note{color:var(--ink-soft);font-size:13px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink-strong);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:600;font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}

/* Ouverture */
#splash{position:fixed;inset:0;z-index:100;background:#fff;display:grid;place-items:center;cursor:pointer;transition:opacity .6s}
#splash canvas{width:min(70vw,640px);height:auto;max-height:70vh;object-fit:contain}
#splash .skip{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#a3a8b6;font-size:12px;letter-spacing:.2em;text-transform:uppercase}
#splash.out{opacity:0;pointer-events:none}
#tracecatch{position:fixed;inset:0;z-index:90;cursor:pointer}

@media (max-width:1280px){.frames{grid-template-columns:minmax(0,1fr)}}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr)}
  .panel{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding:14px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px))}
  .center{padding:14px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
  .stamp{left:50%}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ttl.sm text{font-size:17px;letter-spacing:.16em}
  .frame-head .ttl{min-width:0;flex-basis:100%}
  #fr-inv .frame-head{flex-wrap:wrap}
  #fr-inv .frame-head .ttl{width:100%}
}
@media (prefers-reduced-motion:reduce){.drawer,.toast{transition:none}.die{animation:none}}
</style>
</head>

  (c.fractures||[]).forEach(z=>{ if(FRACTURE_STAT[z]) halved.add(FRACTURE_STAT[z]); });
  halved.forEach(s=>r[s]=Math.ceil(r[s]/2));
  (c.effects||[]).forEach(e=>{ if(e.stat&&STATS.includes(e.stat)&&+e.mod) r[e.stat]=Math.max(0,r[e.stat]+(+e.mod)); });
  let pcItems=0,ppItems=0;
  c.inventory.forEach(it=>{const w=+it.weight||0; if(it.itemType==='backpack') pcItems+=w; else pcItems-=w; if(it.itemType==='armor') ppItems+=+it.armorPoints||0;});
  const pcMax=(r.FOR+3)+(c.race==='elfe'?2:0);
  return {r,halved,ptRed,pc:pcMax+pcItems,pcMax,pvMax:r.RES+5,pa:Math.max(1,Math.ceil(r.DEX/3)),pp:(c.race==='droide'?1:0)+ppItems};
}

function normalize(ch){
  const c=Object.assign(blankCharacter(),ch||{});
  c.stats=Object.assign({FOR:0,RES:0,CHA:0,SAV:0,DEX:0,PER:0},c.stats||{});
  if(typeof c.notes==='string') c.notes=c.notes.trim()?[{id:Date.now(),title:'Notes générales',content:c.notes}]:[];
  if(!Array.isArray(c.fractures)) c.fractures=[];
  if(!Array.isArray(c.effects)) c.effects=[];
  if(c.activeStatus==='fracture'){ if(c.fractureLocation){ const m={'Bras G':'Bras G','Bras D':'Bras D','Jambe G':'Jambe G','Jambe D':'Jambe D','Torse':'Corps','Tête':'Tête'}[c.fractureLocation]; if(m&&!c.fractures.includes(m)) c.fractures.push(m);} c.activeStatus='ok'; }
  delete c.fractureLocation;
  c.fractures=[...new Set(c.fractures.map(ZFIX))].filter(z=>FRACTURE_STAT[z]);
  if(c.activeStatus&&STATUS[c.activeStatus]&&!hasFx(c,c.activeStatus)) c.effects.push(presetFx(c.activeStatus));
  delete c.activeStatus;
  if(Array.isArray(c.particularities)&&c.particularities.length&&typeof c.particularities[0]==='string'){
    c.particularities.forEach((p,i)=>c.cybernetics.push({id:Date.now()+i,name:'Particularité '+(i+1),bodyPart:'',type:'particularity',ability:p,stat:'',diceBonus:0,successThreshold:8}));
    c.particularities=[];
  }
  // mains : les anciennes armes « équipées » prennent une main
  const used=new Set();
  c.inventory.forEach(it=>{ if(!it.itemType) it.itemType='misc'; if(it.zone===undefined) it.zone='';
    if(isWeapon(it)&&it.equipped&&!it.zone){ if((it.hands||1)===2&&!used.size){ it.zone='Mains'; used.add('Main G');used.add('Main D'); } else { const h=HANDS.find(x=>!used.has(x)); if(h){ it.zone=h; used.add(h);} } }
    it.equipped=handsOf(it).length>0; });
  c.cybernetics.forEach(x=>{ x.bodyPart=ZFIX(x.bodyPart||''); });
  c.inventory.forEach(it=>{ if(!isWeapon(it)&&it.zone!=='Combi') it.zone=ZFIX(it.zone||''); });
  return c;
}

async function writeHandle(h){ const w=await h.createWritable(); await w.write(serialize()); await w.close(); }

async function saveAs(){
  const name=fileBase()+'.adb';
  if(window.showSaveFilePicker){
    try{ const h=await showSaveFilePicker({suggestedName:name,types:[{description:'Fiche Aldebaran',accept:{'application/json':['.adb']}}]});
      await writeHandle(h); fileHandle=h; fileName=h.name; afterSave(); return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }
  try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([serialize()],{type:'application/json'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),2000); fileName=name; afterSave(); }
  catch(e){ toast("Le téléchargement est bloqué ici. La fiche reste sauvegardée dans ce navigateur."); }
}
function afterSave(){ Store.saveLocal(); dirty=false; lastSaved=new Date(); updateSaveState(); toast('Fiche enregistrée'); }
async function openFile(){
  if(window.showOpenFilePicker){
    try{ const [h]=await showOpenFilePicker({types:[{description:'Fiche Aldebaran',accept:{'application/json':['.adb','.json']}}]});
      const f=await h.getFile(); loadText(await f.text(),f.name); fileHandle=h; return; }
    catch(e){ if(e&&e.name==='AbortError') return; }
  }

}
function loadText(txt,name){
  try{ const d=JSON.parse(txt); C=normalize(d.character||d); fileHandle=null; fileName=name; dirty=false; lastSaved=new Date();

}

const GRIP=`<svg viewBox="0 0 12 18" fill="currentColor"><circle cx="3" cy="3" r="1.5"/><circle cx="9" cy="3" r="1.5"/><circle cx="3" cy="9" r="1.5"/><circle cx="9" cy="9" r="1.5"/><circle cx="3" cy="15" r="1.5"/><circle cx="9" cy="15" r="1.5"/></svg>`;
const cell=(f,v)=>`<input class="c n" data-f="${f}" inputmode="numeric" value="${esc(v)}">`;
const NA='<span class="c na"></span>';
function rowInv(it){
  const tk=typeKey(it), T=ITEM_TYPES[tk]||ITEM_TYPES.misc, w=isWeapon(it), d=diceOf(it), t=it.itemType;
  let zoneCell=NA;
  if(w){ const hs=handsOf(it), v=hs.length===2?'Mains':hs[0]||''; zoneCell=`<select class="zc" data-f="hand" aria-label="Main">${[['','—'],...((it.hands||1)===2?[['Mains','Deux mains']]:[['Main G','Main G'],['Main D','Main D'],['Mains','Deux mains']])].map(([k,l])=>`<option value="${k}" ${v===k?'selected':''}>${l}</option>`).join('')}</select>`; }
  else if(t!=='backpack') zoneCell=`<select class="zc" data-f="zone" aria-label="Zone">${[['','—'],...ZONES.map(z=>[z,z]),...(t==='armor'?[['Combi','Combinaison']]:[])].map(([k,l])=>`<option value="${k}" ${it.zone===k?'selected':''}>${l}</option>`).join('')}</select>`;
  const inHand=handsOf(it).length>0;
  return `<div class="row ${inHand?'equipped':''}" data-id="${it.id}" data-col="inv">
    <button type="button" class="grip" data-drag title="Glisser sur le corps" aria-label="Glisser sur le corps">${GRIP}</button>

    <input class="nm" data-f="name" value="${esc(it.name)}" aria-label="Nom" title="${T.label}">
    ${zoneCell}
    ${w?`<select class="c" data-f="stat" aria-label="Statistique">${statOpts(it.stat)}</select>`:NA}
    ${w?cell('diceBonus',it.diceBonus||0):NA}
    ${w?cell('successThreshold',it.successThreshold||8):NA}
    ${t!=='backpack'?cell('weight',it.weight||0):NA}
    ${t==='backpack'?cell('weight',it.weight||0):NA}
    ${t==='armor'?cell('armorPoints',it.armorPoints||0):NA}
    ${w?`<input class="c n" data-f="bastosCost" value="${esc(it.bastosCost??'-')}">`:NA}
    <input class="ds" data-f="specialAbility" value="${esc(it.specialAbility)}" placeholder="Effets & description" aria-label="Effets et description">
    <div class="acts"><button type="button" class="ib" data-a="del" title="Supprimer">${svgI('x')}</button></div>
  </div>`;
}
function rowCyb(c){
  const T=CYB_TYPES[c.type]||CYB_TYPES.particularity, d=diceOf(c);
  return `<div class="row cyb" data-id="${c.id}" data-col="cyb">
    <button type="button" class="grip" data-drag title="Glisser sur le corps" aria-label="Glisser sur le corps">${GRIP}</button>

    <input class="nm" data-f="name" value="${esc(c.name)}" aria-label="Nom">
    <select class="zc" data-f="bodyPart" aria-label="Zone">${[['','—'],...ZONES.map(z=>[z,z])].map(([k,l])=>`<option value="${k}" ${c.bodyPart===k?'selected':''}>${l}</option>`).join('')}</select>
    <select class="c" data-f="stat" aria-label="Statistique">${statOpts(c.stat)}</select>
    ${cell('diceBonus',c.diceBonus||0)}${cell('successThreshold',c.successThreshold||8)}${NA}${NA}${NA}${NA}
    <input class="ds" data-f="ability" value="${esc(c.ability)}" placeholder="Effet & utilisation" aria-label="Effet">
    <div class="acts"><button type="button" class="ib" data-a="del" title="Supprimer">${svgI('x')}</button></div>

}
const HEAD=`<div class="row head"><span></span><span></span><span class="h l">Nom</span><span class="h l">Zone</span>
  <span class="h" title="Statistique utilisée">${svgI('dice','var(--danger)')}Stat</span><span class="h" title="Dés ajoutés à la statistique">+ D</span><span class="h" title="Seuil de réussite">${svgI('trophy','var(--c-for)')}</span>
  <span class="h" title="Charge occupée">${svgI('box','#a0642b')}−</span><span class="h" title="Charge ajoutée (sac)">${svgI('box','#a0642b')}+</span><span class="h" title="Points d'armure">${svgI('shield','var(--c-res)')}</span><span class="h" title="Consommation en Bastos">${svgI('burst','var(--danger)')}₿</span>
  <span class="h l">Effets &amp; description</span><span></span></div>`;
function renderCards(){
  const rows=[...C.inventory.map(rowInv),...C.cybernetics.map(rowCyb)];
  $('inv').innerHTML=rows.length?HEAD+rows.join(''):`<div class="empty-frame">L'inventaire est vide. Le « + » ajoute un équipement, une cybernétique ou une mutation.</div>`;
}
function renderNotes(){
  $('notes').innerHTML=C.notes.length?C.notes.map(n=>`<div class="note" data-id="${n.id}"><div class="top"><input class="line-in" data-nf="title" value="${esc(n.title)}" aria-label="Titre"><button class="ib" type="button" data-a="delnote" title="Supprimer l'entrée">${svgI('x')}</button></div><textarea data-nf="content" aria-label="Contenu">${esc(n.content)}</textarea></div>`).join('')
   :`<p class="empty-note">Le journal est vide. Ajoutez une entrée pour noter un indice, un contact ou une dette.</p>`;
}
function renderAll(){ renderIdentity(); renderCards(); renderDerived(); renderNotes(); }

/* =========================================================
   INTERACTIONS
   ========================================================= */
function changePv(delta){
  const D=derive(C), old=C.pv, nv=Math.min(D.pvMax,Math.max(-1,old+delta));
  if(nv!==old){
    if(nv<=4&&nv>0&&old>4) addFx('pasTop');
    else if(nv<=0&&old>0){ delFx('pasTop'); addFx('stun'); }
    else if(nv>0&&nv<=4&&old<=0){ delFx('stun'); addFx('pasTop'); }
    else if(nv>=5&&old<5){ delFx('pasTop'); delFx('stun'); }
  }
  C.pv=nv;
}
function clampPv(){ const D=derive(C); if(C.pv>D.pvMax) C.pv=D.pvMax; }
function toggleFracture(z){ const i=C.fractures.indexOf(z); if(i>=0){ C.fractures.splice(i,1); toast(`${z} soigné`);} else { C.fractures.push(z); toast(`Fracture : ${z} (${FRACTURE_STAT[z]} / 2)`);} clampPv(); renderDerived(); renderCards(); markDirty(); }
function takeHand(it,target){
  const want=target==='Mains'?['Main G','Main D']:[target];
  const cur=handsOf(it);
  if(cur.length&&(target==='Mains'||cur.includes(target))){ it.zone=''; it.equipped=false; return; }
  const busy=C.inventory.filter(o=>o!==it&&handsOf(o).some(h=>want.includes(h)));
  if(busy.length){ toast(`${want.length>1?'Les mains sont':want[0]+' est'} déjà prise${want.length>1?'s':''} : rangez d'abord ${busy.map(b=>b.name||'l\'arme').join(', ')}.`); return; }
  it.zone=target; it.equipped=true;
}
const listOf=col=>col==='inv'?C.inventory:C.cybernetics;
const findCard=el=>{ const card=el.closest('.row:not(.head)'); if(!card) return {}; const list=listOf(card.dataset.col); return {card,list,it:list.find(x=>x.id===+card.dataset.id)}; };

document.addEventListener('click',e=>{
  const pm=e.target.closest('[data-pm]');
  if(pm){ const k=pm.dataset.pm,d=+pm.dataset.d; if(k==='pv') changePv(d); else C[k]=Math.max(0,(+C[k]||0)+d); if(k==='pt') clampPv(); renderDerived(); renderCards(); markDirty(); return; }
  const rl=e.target.closest('[data-roll]'); if(rl){ rollItem(STAT_INFO[rl.dataset.roll].name,rl.dataset.roll,0,8); return; }
  const z=e.target.closest('#zones .zone'); if(z){ toggleFracture(z.dataset.zone); return; }
  const fd=e.target.closest('[data-fxdel]'); if(fd){ C.effects=C.effects.filter(x=>x.id!==+fd.dataset.fxdel); clampPv(); renderDerived(); renderCards(); markDirty(); return; }
  const fe=e.target.closest('[data-fxedit]'); if(fe){ fxDialog(C.effects.find(x=>x.id===+fe.dataset.fxedit)); return; }
  const hl=e.target.closest('[data-heal]'); if(hl){ toggleFracture(hl.dataset.heal); return; }
  const tg=e.target.closest('.tagp');
  if(tg&&(e.target.closest('[data-tagx]')||e.target.closest('[data-tagroll]'))){ const list=listOf(tg.dataset.col), it=list.find(x=>x.id===+tg.dataset.id); if(!it) return;
    if(e.target.closest('[data-tagroll]')){ tg.dataset.col==='inv'?useItem(it):rollItem(it.name||'Capacité',it.stat,it.diceBonus,it.successThreshold); return; }
    if(tg.dataset.col==='cyb') it.bodyPart=''; else { it.zone=''; it.equipped=false; }
    renderCards(); renderDerived(); markDirty(); return; }
  const a=e.target.closest('.row [data-a]');
  if(a){ const {list,it,card}=findCard(a); if(!it) return;
    if(a.dataset.a==='del'){ list.splice(list.indexOf(it),1); }
    else if(a.dataset.a==='unassign'){ if(card.dataset.col==='cyb') it.bodyPart=''; else { it.zone=''; it.equipped=false; } }
    else if(a.dataset.a==='combi'){ it.zone=it.zone==='Combi'?'':'Combi'; }
    else if(a.dataset.a==='use'){ card.dataset.col==='inv'?useItem(it):rollItem(it.name||'Capacité',it.stat,it.diceBonus,it.successThreshold); return; }
    renderCards(); renderDerived(); markDirty(); return; }
  const dn=e.target.closest('[data-a="delnote"]'); if(dn){ const id=+dn.closest('.note').dataset.id; C.notes=C.notes.filter(n=>n.id!==id); renderNotes(); markDirty(); return; }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='f-name'){ C.name=t.value; markDirty(); return; }
  if(t.id&&t.id.startsWith('sc-')){ const v=t.value.replace(/\D/g,''); if(v!==t.value) t.value=v; C.stats[t.id.slice(3)]=Math.min(99,parseInt(v)||0); clampPv(); renderDerived(); markDirty(); return; }
  if(t.tagName!=='SELECT'&&t.dataset.f){ const {it}=findCard(t); if(!it) return; const f=t.dataset.f;
    it[f]=['diceBonus','successThreshold','weight','armorPoints'].includes(f)?(parseInt(t.value)||0):t.value;
    if(['weight','armorPoints','name'].includes(f)) renderDerived();
    markDirty(); return; }
  const nt=t.closest('.note'); if(nt){ const n=C.notes.find(x=>x.id===+nt.dataset.id); if(n){ n[t.dataset.nf]=t.value; markDirty(); } }
});
// numéros modifiés dans une vignette : rafraîchir le résumé et le bouton d'attaque en sortie de champ
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='f-race'){ C.race=t.value; clampPv(); renderDerived(); renderCards(); markDirty(); return; }
  if(t.closest('.row')&&t.dataset.f){ const {it,card}=findCard(t); if(!it) return;
    if(t.tagName==='SELECT'&&t.dataset.f==='type'&&card.dataset.col==='inv'){ const v=t.value; if(v.startsWith('weapon')){ const was=isWeapon(it); it.itemType='weapon'; it.hands=v==='weapon2'?2:1; if(!was) it.zone=''; if(it.hands===2&&handsOf(it).length) it.zone='Mains'; } else { if(isWeapon(it)) it.zone=''; it.itemType=v; it.hands=null; if(v!=='armor'&&it.zone==='Combi') it.zone=''; } it.equipped=handsOf(it).length>0; }
    else if(t.dataset.f==='hand'){ const v=t.value; if(!v){ it.zone=''; it.equipped=false; } else assign('inv',it,v==='Mains'?{hand:'Main G',both:true}:{hand:v}); }
    else if(t.tagName==='SELECT') it[t.dataset.f]=t.value;
    if(t.tagName==='SELECT'||['diceBonus','successThreshold','stat'].includes(t.dataset.f)){ renderCards(); renderDerived(); markDirty(); } }
});

let tipZone=null;

  if(document.body.classList.contains('dragmode')) return;
  const tp=e.target.closest('.tagp');

document.addEventListener('click',e=>{ const ef=e.target.closest('.stat .eff'); if(!ef) return; const st=ef.closest('.stat'); st.classList.add('editing'); const i=st.querySelector('.statin'); i.focus(); i.select(); });
document.addEventListener('focusout',e=>{ if(e.target.classList&&e.target.classList.contains('statin')) e.target.closest('.stat').classList.remove('editing'); });
/* Glisser-déposer : une ligne de l'inventaire sur une zone du corps ou une main */
let drag=null;
function dropTarget(x,y){ const el=document.elementFromPoint(x,y); if(!el) return null;
  const h=el.closest('.hand-t'); if(h) return {hand:h.dataset.hand,el:h};
  const z=el.closest('#zones .zone'); if(z) return {zone:z.dataset.zone,el:z}; return null; }
function assign(col,it,t){
  if(col==='cyb'){ it.bodyPart=t.zone||armOf(t.hand); toast(`${it.name||'Élément'} → ${it.bodyPart}`); return; }
  if(isWeapon(it)){
    let h=t.hand||(t.zone==='Bras G'?'Main G':t.zone==='Bras D'?'Main D':null);
    if(!h){ toast('Une arme se tient en main : déposez-la sur une main ou un bras.'); return; }
    let want=(it.hands||1)===2||t.both?'Mains':h;
    const cur=handsOf(it); if(!t.both&&(it.hands||1)!==2&&cur.length===1&&cur[0]!==h&&!t.fromSel) want='Mains';   // déjà dans l'autre main : à deux mains
    const need=want==='Mains'?HANDS:[want];
    C.inventory.forEach(o=>{ if(o!==it&&isWeapon(o)&&handsOf(o).some(x=>need.includes(x))){ o.zone=''; o.equipped=false; toast(`${o.name||'Arme'} rangée`); } });
    it.zone=want; it.equipped=true; return;
  }
  it.zone=t.zone||armOf(t.hand);
}
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('[data-drag]'); if(!g||e.button>0) return;
  const {card,it}=findCard(g); if(!it) return; e.preventDefault();
  const ic=card.querySelector('.tico').innerHTML;
  const gh=document.createElement('div'); gh.className='ghost-drag'; gh.innerHTML=`${ic}<span>${esc(it.name||'Élément')}</span><small>sur le corps</small>`; document.body.appendChild(gh);
  drag={card,it,col:card.dataset.col,gh,target:null,x:e.clientX,y:e.clientY,moved:false};
  card.classList.add('dragging'); document.body.classList.add('dragmode');
  gh.style.left=e.clientX+'px'; gh.style.top=e.clientY+'px';
  const loop=()=>{ if(!drag) return; if(drag.y<70) window.scrollBy(0,-14); else if(drag.y>innerHeight-50) window.scrollBy(0,14); requestAnimationFrame(loop); }; requestAnimationFrame(loop);
});
document.addEventListener('pointermove',e=>{
  if(!drag) return; drag.x=e.clientX; drag.y=e.clientY; drag.moved=true;
  drag.gh.style.left=e.clientX+'px'; drag.gh.style.top=e.clientY+'px';
  const t=dropTarget(e.clientX,e.clientY);
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  if(t){ let el=t.el; if(isWeapon(drag.it)&&drag.col==='inv'&&t.zone&&/Bras/.test(t.zone)) el=document.querySelector(`.hand-t[data-hand="${t.zone.replace('Bras','Main')}"]`); el.classList.add('drop'); }
  drag.target=t;
});
function endDrag(ok){
  if(!drag) return; const d=drag; drag=null;
  d.gh.remove(); d.card.classList.remove('dragging'); document.body.classList.remove('dragmode');
  document.querySelectorAll('.drop').forEach(x=>x.classList.remove('drop'));
  if(ok&&d.target){ assign(d.col,d.it,d.target); renderCards(); renderDerived(); markDirty(); }
}
document.addEventListener('pointerup',()=>endDrag(true));
document.addEventListener('pointercancel',()=>endDrag(false));
document.addEventListener('keydown',e=>{ if(e.key==='Escape') endDrag(false); });

/* Dés : pool de D10, seuil 8 par défaut, « Pas top top » = seuil +1 */
function rollItem(label,stat,bonus,threshold){
  const D=derive(C); const n=(D.r[stat]||0)+(+bonus||0);
  if(n<=0){ toast('Pas assez de dés pour ce jet.'); return; }
  let th=+threshold||8; if(hasFx(C,'pasTop')) th+=1;
  showRoll(label,Array.from({length:n},()=>1+Math.floor(Math.random()*10)),th,stat?`${stat} ${D.r[stat]}${bonus?` + ${bonus}`:''} dés`:'');
}
const SHELL='<svg viewBox="0 0 10 24"><path d="M2 9.5C2 5 3.4 1.5 5 1.5S8 5 8 9.5z" fill="#c9883a"/><rect x="2" y="9.5" width="6" height="11" fill="#e6b450"/><rect x="1.3" y="20" width="7.4" height="2.6" rx=".6" fill="#b7862e"/><rect x="3.2" y="10.5" width="1.2" height="9" fill="#f6d98a"/></svg>';
function shellBurst(cost){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const src=$('bastos-val'); if(!src) return; const r=src.getBoundingClientRect(); if(!r.width) return;
  const n=Math.max(1,Math.min(cost,7)), x0=r.left+r.width/2, y0=r.top+r.height/2;
  for(let i=0;i<n;i++){
    const el=document.createElement('div'); el.className='shell'; el.innerHTML=SHELL; document.body.appendChild(el);
    el.style.left=x0+'px'; el.style.top=y0+'px';
    const dx=(Math.random()*2-1)*90, up=-(70+Math.random()*70), rot=(Math.random()<.5?-1:1)*(360+Math.random()*540);
    el.animate([{transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},
                {transform:`translate(calc(-50% + ${dx*.7}px), calc(-50% + ${up}px)) rotate(${rot*.6}deg)`,opacity:1,offset:.45},
                {transform:`translate(calc(-50% + ${dx}px), calc(-50% + ${up+150}px)) rotate(${rot}deg)`,opacity:0}],
               {duration:900+Math.random()*300,delay:i*70,easing:'cubic-bezier(.2,.7,.4,1)',fill:'both'}).onfinish=()=>el.remove();
  }
  const f=document.createElement('div'); f.className='shell-cost'; f.textContent=`−${cost} ₿`; document.body.appendChild(f);
  f.style.left=x0+'px'; f.style.top=y0+'px';
  f.animate([{transform:'translate(-50%,-50%)',opacity:0},{transform:'translate(-50%,-140%)',opacity:1,offset:.25},{transform:'translate(-50%,-230%)',opacity:0}],{duration:1300,easing:'ease-out',fill:'both'}).onfinish=()=>f.remove();
  src.animate([{transform:'scale(1)'},{transform:'scale(.86)',color:'var(--danger)'},{transform:'scale(1)'}],{duration:320});
}
function useItem(it){
  if(it.bastosCost!==''&&it.bastosCost!=='-'&&!isNaN(it.bastosCost)){ const cost=parseInt(it.bastosCost); if((+C.bastos||0)<cost){ toast('Pas assez de Bastos pour utiliser cet objet.'); return; } C.bastos-=cost; renderDerived(); markDirty(); if(cost>0) shellBurst(cost); }
  rollItem(it.name||'Objet',it.stat,it.diceBonus,it.successThreshold);
}
function showRoll(label,rolls,th,detail,_re){
  if(!_re) logRoll(label,rolls,th,rolls.filter(r=>r>=th).length);
  const crit2=hasFx(C,'pompette3');
  const succ=rolls.filter(r=>r>=th).length, tens=rolls.filter(r=>r===10).length, fails=rolls.filter(r=>r===1||(crit2&&r===2)).length;
  openDialog(`<h3>${esc(label)}</h3>
    <p class="meta">${detail?esc(detail)+' · ':''}seuil ${th}+${hasFx(C,'pasTop')?' (Pas top top)':''}</p>
    <div class="dice">${rolls.map((r,i)=>`<div class="die ${r===10?'crit':r>=th?'ok':(r===1||(crit2&&r===2))?'fail':''}" style="animation-delay:${i*60}ms">${r}</div>`).join('')}</div>
    <div class="verdict ${succ?'win':'lose'}">${succ} succès</div>
    <p class="meta">${tens?`${tens} × 10 (critique) · `:''}${fails?`${fails} échec${fails>1?'s':''} critique${fails>1?'s':''} · `:''}${rolls.length} dé${rolls.length>1?'s':''}</p>
    <div class="actions"><button class="btn ghost" type="button" data-close>Fermer</button><button class="btn" type="button" id="reroll">Relancer</button></div>`);
  $('reroll').onclick=()=>showRoll(label,rolls.map(()=>1+Math.floor(Math.random()*10)),th,detail);
}
const dlg=$('dlg');
function openDialog(html){ $('dlg-body').innerHTML=html; if(!dlg.open) dlg.showModal(); dlg.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>dlg.close()); }
dlg.addEventListener('click',e=>{ if(e.target===dlg) dlg.close(); });
let toastT=null;
function toast(msg){ const t=$('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2600); }

function fxDialog(edit){
  const e=edit||{name:'',kind:'buff',stat:'',mod:0,turns:'',desc:''};
  const presets=edit?'':`<div class="subttl">États du jeu</div><div class="fxgrid">${Object.entries(STATUS).map(([k,S])=>`<button type="button" data-preset="${k}" ${hasFx(C,k)?'disabled style="opacity:.45"':''}><b><svg class="pi" viewBox="0 0 24 24" style="stroke:${S.col}">${FX_ICO[k]||FX_ICO.etat}</svg>${S.name}</b><span>${S.desc}</span></button>`).join('')}</div><div class="subttl">Effet personnalisé</div>`;
  openDialog(`<h3>${edit?'Modifier l\'effet':'Ajouter un effet'}</h3>${presets}
    <div class="fxform">
      <label class="full">Nom<input id="fx-name" value="${esc(e.name)}" placeholder="Ex. Stimpack, Bénédiction, Gueule de bois"></label>
      <label>Type<select id="fx-kind">${Object.entries(KIND).map(([k,l])=>`<option value="${k}" ${e.kind===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <label>Durée (tours)<input id="fx-turns" inputmode="numeric" value="${e.turns??''}" placeholder="Permanent"></label>
      <label>Statistique<select id="fx-stat"><option value="">Aucune</option>${STATS.map(x=>`<option ${e.stat===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label>Modificateur<input id="fx-mod" inputmode="numeric" value="${+e.mod||''}" placeholder="+1, −2…"></label>
      <label class="full">Description<textarea id="fx-desc">${esc(e.desc)}</textarea></label>
    </div>
    <div class="actions"><button class="btn ghost" type="button" data-close>Annuler</button><button class="btn" type="button" id="fx-ok">${edit?'Enregistrer':'Ajouter'}</button></div>`);
  $('dlg-body').querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{ addFx(b.dataset.preset); dlg.close(); clampPv(); renderDerived(); renderCards(); markDirty(); });
  $('fx-ok').onclick=()=>{
    const name=$('fx-name').value.trim(); if(!name){ $('fx-name').focus(); toast('Donnez un nom à l\'effet.'); return; }
    const t=$('fx-turns').value.replace(/\D/g,''), m=parseInt($('fx-mod').value.replace('−','-').replace(/[^\d-]/g,''))||0;
    const o=edit||{id:Date.now(),key:'custom'};
    Object.assign(o,{name,kind:$('fx-kind').value,turns:t===''?null:+t,stat:$('fx-stat').value,mod:m,desc:$('fx-desc').value.trim()});
    if(!edit) C.effects.push(o);
    dlg.close(); clampPv(); renderDerived(); renderCards(); markDirty();
  };
}

$('b-guide').onclick=()=>{
  openDialog(`<h3>Guide</h3><div class="guide">
    <h4>Le volet de gauche</h4><p>Personnage, Décompte et Statistiques. Dans chaque statistique, le petit cercle contient la valeur de base, le grand cercle le nombre de dés lancés après malus. Cliquez le grand cercle pour lancer : pool de D10, seuil 8+, un 10 est un critique, un 1 un échec critique.</p>
    <h4>Le corps</h4><ul><li>Un clic sur une partie du corps la fracture, un second clic la soigne. Plusieurs fractures peuvent coexister.</li><li>Six zones : Tête → PER / 2, Corps → RES / 2, Bras (main comprise) → DEX / 2, Jambe → FOR / 2. Les os de la zone fracturée passent au rouge. Deux fractures sur la même statistique ne la divisent qu'une fois.</li><li>Les pastilles indiquent combien de vignettes sont reliées à chaque partie (bleu : inventaire, violet : cyber).</li></ul>
    <h4>Inventaire</h4><ul><li>Le « + » ajoute un équipement (arme, armure, divers, sac) ou une cybernétique, mutation, particularité.</li><li>Pour attribuer une ligne au corps, attrapez-la par sa poignée (ou son icône) et déposez-la sur une zone. Le × sur l'étiquette la retire.</li><li>Une arme se dépose sur une main ; déposée sur l'autre main, elle se tient à deux mains. Une main occupée se ferme en poing.</li><li>Une armure protège sa zone, ou tout le corps avec « Combi » : un trait bleu épais longe alors la silhouette protégée.</li><li>PC = FOR + 3 (+2 Elfe), moins le poids des objets, plus les sacs. PP = armures (+1 Droïde).</li></ul>
    <h4>Effets actifs</h4><p>Chaque effet acquis devient une bulle avec son icône, qui tourne lentement sur le cercle autour de la silhouette : trait racial (ADN), fractures, états du jeu, bonus et malus. Au survol, les bulles s'arrêtent et une infobulle décrit l'effet, avec Modifier / Retirer (ou Soigner pour une fracture). Le « + » en haut à gauche du dessin ajoute un effet.</p>
    <h4>Décompte</h4><p>PV max = RES + 5. Sous 5 PV : « Pas top top » (seuil +1). À 0 : étourdissement. À −1 : hors jeu. À 10 PE, le cadran d'éveil s'allume. Tous les 10 PT, chaque statistique perd 1.</p>
    <h4>Sauvegarde</h4><p>Les fiches s'enregistrent en <b>.adb</b>. Ctrl+S réécrit le fichier ouvert, Ctrl+Maj+S en crée un nouveau. La sauvegarde automatique se règle dans les Paramètres.</p>
    </div><div class="actions"><button class="btn" type="button" data-close>Fermer</button></div>`);
};

let installEvt=null;
window.addEventListener('beforeinstallprompt',e=>{ e.preventDefault(); installEvt=e; const m=$('inst-msg'); if(m) m.textContent=installMsg(); });

const isStandalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent);
function installMsg(){
  if(isStandalone()) return 'Vous utilisez déjà l\'application installée.';
  if(installEvt) return 'Ajoute Aldebaran à vos applications, avec son icône.';
  if(isIOS()) return 'Sur iPhone / iPad : bouton Partager, puis « Sur l\'écran d\'accueil ».';
  return 'Si rien ne se passe, utilisez « Installer » dans le menu du navigateur (Chrome, Edge).';
}
async function doInstall(){
  if(installEvt){ installEvt.prompt(); const r=await installEvt.userChoice; installEvt=null; if(r.outcome==='accepted') dlg.close(); else $('inst-msg').textContent=installMsg(); return; }
  toast(installMsg());
}

/* =========================================================
   OUVERTURE : logo, puis l'interface se trace, le dessin apparaît à l'encre, les bandes ferment
   ========================================================= */
let traceAnims=[];
function playTrace(){
  document.documentElement.classList.remove('booting');
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return Promise.resolve();
  traceAnims.forEach(a=>a.cancel()); traceAnims=[];
  const catcher=document.createElement('div'); catcher.id='tracecatch'; catcher.title='Cliquer pour passer'; document.body.appendChild(catcher);
  const A=(el,kf,opt)=>{ const a=el.animate(kf,Object.assign({fill:'backwards',easing:'ease-in-out'},opt)); traceAnims.push(a); return a; };
  const vis=el=>el.getClientRects().length>0;
  const len=el=>{ let L=60; try{L=el.getTotalLength()||60}catch(e){} return Math.ceil(L)+2; };
  const dash=(el,t,dur)=>{ const L=len(el); A(el,[{strokeDasharray:`${L} ${L}`,strokeDashoffset:L},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0}],{delay:t*1000,duration:dur*1000}); };
  const write=(sp,t)=>A(sp,[{strokeOpacity:1,strokeDasharray:'240 240',strokeDashoffset:240,fillOpacity:0},{strokeOpacity:1,strokeDasharray:'240 240',strokeDashoffset:0,fillOpacity:0,offset:.72},{strokeOpacity:0,strokeDasharray:'240 240',strokeDashoffset:0,fillOpacity:1}],{delay:t*1000,duration:480,easing:'ease-out'});
  const wipe=(el,t,dur)=>A(el,[{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],{delay:t*1000,duration:dur*1000});
  const fade=(el,t)=>A(el,[{opacity:0},{opacity:1}],{delay:t*1000,duration:380,easing:'ease-out'});
  const qa=s=>[...document.querySelectorAll(s)].filter(vis);

  qa('.ttl').forEach((svg,k)=>[...svg.querySelectorAll('tspan')].forEach((sp,i)=>write(sp,.05+Math.min(k,3)*.3+(k>=3?1.4:0)+i*.065)));
  qa('.panel .hr').forEach((h,i)=>wipe(h,.35+i*.3,.5));
  qa('#stats .dial').forEach((d,i)=>{ d.querySelectorAll('.ring').forEach(r=>dash(r,.55+i*.1,.55)); d.querySelectorAll('.ico .tr').forEach(p=>dash(p,.8+i*.1,.4)); });
  qa('#counters .dial').forEach((d,i)=>{ d.querySelectorAll('.ring').forEach(r=>dash(r,.85+i*.1,.55)); d.querySelectorAll('.ico .tr').forEach(p=>dash(p,1.1+i*.1,.4)); });
  // Vitruve : les lignes de construction d'abord, puis le corps trait par trait, de haut en bas
  const vp=qa('.vit > *'), nv=vp.length;
  vp.forEach((p,i)=>{ if(i<2) dash(p,.4+i*.3,1.0); else if(i===2) dash(p,1.0,2.0);
    else { const L=len(p), t=2.2+(i-3)/Math.max(1,nv-3)*1.1;
      A(p,[{strokeDasharray:`${L} ${L}`,strokeDashoffset:L,fillOpacity:0},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0,fillOpacity:0,offset:.65},{strokeDasharray:`${L} ${L}`,strokeDashoffset:0,fillOpacity:1}],{delay:t*1000,duration:420}); } });
  qa('.frame-head').forEach((h,i)=>A(h,[{borderBottomColor:'transparent'},{borderBottomColor:'transparent'}],{delay:0,duration:(1.9+i*.2)*1000}));
  qa('.fade').forEach((el,i)=>fade(el,2.1+Math.min(i,50)*.014));
  qa('.row,.empty-frame,.tagp,#leads,.bub').forEach((el,i)=>fade(el,2.7+i*.06));
  qa('.band').forEach((b,i)=>wipe(b,3.0+i*.07,.7));
  const end=Math.max(...traceAnims.map(a=>{const t=a.effect.getTiming(); return t.delay+t.duration;}));
  return new Promise(res=>{
    const finish=()=>{ traceAnims.forEach(a=>a.finish()); catcher.remove(); res(); };
    catcher.onclick=finish;
    setTimeout(()=>{ catcher.remove(); res(); },end+50);
  });
}

function plain(l){ctx.drawImage(l.img,l.x,l.y);}

function drawLetter(l,p){
  if(p<=0) return; if(p>=1){plain(l);return;}
  const soft=0.07, f=p*(1+soft), src=l.base.data, dst=l.work.data, o=l.ordv;
  for(let i=0,n=o.length;i<n;i++){
    const k=(f-o[i])/soft; dst[i*4+3]= k>=1?src[i*4+3]:k<=0?0:src[i*4+3]*k;
  }

  ctx.drawImage(scratch,l.x,l.y);
  // pointe de plume qui suit le tracé
  let pt=l.pen[0]; for(const q of l.pen){ if(q[2]<=p) pt=q; else break; }
  const a=Math.min(1,Math.sin(Math.PI*p)*1.5), r=11;
  const g=ctx.createRadialGradient(pt[0],pt[1],0,pt[0],pt[1],r);
  g.addColorStop(0,`rgba(20,22,29,${a})`); g.addColorStop(.4,`rgba(20,22,29,${a*.4})`); g.addColorStop(1,'rgba(20,22,29,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(pt[0],pt[1],r,0,Math.PI*2); ctx.fill();
}

function astDist(t){ const p=prog(t,AST.start,AST.dur); if(p<=0) return Infinity; const e=0.35*p+0.65*(1-(1-p)*(1-p)); return 1100*(1-e); }
function drawFiller(t){
  ctx.save(); ctx.beginPath(); ctx.arc(D.ax,D.ay,D.Rc+0.6,0,Math.PI*2); ctx.clip();
  const dist=astDist(t);
  if(dist<1e4){ // l'astéroïde chasse le trait au fur et à mesure : on retire la zone qu'il a balayée
    const r=D.Rc+1.2, c=[D.ax+DIR[0]*dist,D.ay+DIR[1]*dist], nx=-DIR[1], ny=DIR[0], far=3000, ang=Math.atan2(ny,nx);
    ctx.beginPath(); ctx.rect(0,0,D.W,D.H);
    ctx.moveTo(c[0]+nx*r,c[1]+ny*r);
    ctx.lineTo(c[0]+nx*r+DIR[0]*far,c[1]+ny*r+DIR[1]*far);
    ctx.lineTo(c[0]-nx*r+DIR[0]*far,c[1]-ny*r+DIR[1]*far);
    ctx.lineTo(c[0]-nx*r,c[1]-ny*r);
    ctx.arc(c[0],c[1],r,ang+Math.PI,ang+2*Math.PI,true);
    ctx.closePath(); ctx.clip('evenodd');
  }
  const A0=276,A1=346, rin=a=>190.0+(187.7-190.0)*(a-A0)/(A1-A0), rout=a=>208.0+(206.1-208.0)*(a-A0)/(A1-A0);

  for(let a=A1;a>=A0;a-=0.5) ctx.lineTo(D.cx+rin(a)*Math.cos(rad(a)),D.cy+rin(a)*Math.sin(rad(a)));

}
function drawArc(l,a0,a1,p,filler){

  const e=a0+(a1-a0)*p;

    const wx=x-D.ax, wy=y-D.ay, pr=wx*DIR[0]+wy*DIR[1], pp=wx*wx+wy*wy-pr*pr, sHit=pr+Math.sqrt(Math.max(0,D.Rc*D.Rc-pp));
    let born=AST.start+AST.dur; for(let k=0;k<=400;k++){const tt=AST.start+AST.dur*k/400; if(astDist(tt)<=sHit){born=tt;break;}}
    out.push({x,y,vx:Math.cos(dir)*v,vy:Math.sin(dir)*v,s:2+rnd()*5,r:rnd()*6,vr:(rnd()-.5)*14,life:.45+rnd()*.4,born});
  }
  return out;});
function drawDebris(t){
  ctx.fillStyle='#14161d';
  for(const d of DEBRIS){
    const k=t-d.born; if(k<0||k>d.life) continue;
    const q=k/d.life, x=d.x+d.vx*k*(1-q*.35), y=d.y+d.vy*k*(1-q*.35);
    ctx.save(); ctx.globalAlpha=1-q; ctx.translate(x,y); ctx.rotate(d.r+d.vr*k);
    const sz=d.s*(1-q*.5); ctx.fillRect(-sz/2,-sz/2,sz,sz*.7); ctx.restore();
  }
}
function drawAsteroid(t){
  const l=L.ast, p=prog(t,AST.start,AST.dur);
  if(p<=0) return;
  if(p>=1){
    // figé : léger tressaillement amorti juste après l'arrivée, puis immobile
    const k=t-(AST.start+AST.dur), w=k<0.28?Math.sin(k*70)*7*Math.exp(-k*16):0;
    ctx.drawImage(l.img,l.x+DIR[0]*w,l.y+DIR[1]*w);
    if(k<0.45){ // onde d'impact
      const q=k/0.45, r=40+q*90;
      ctx.strokeStyle=`rgba(20,22,29,${(1-q)*0.55})`; ctx.lineWidth=3*(1-q)+0.5;
      ctx.beginPath(); ctx.arc(D.ax,D.ay,r,0,Math.PI*2); ctx.stroke();
    }
    return;
  }
  const e=0.35*p+0.65*(1-(1-p)*(1-p)), dist=1100*(1-e), alpha=clamp(p/0.12);
  for(let i=3;i>=1;i--){ // sillage
    const d2=dist+i*55*(1-e);
    ctx.globalAlpha=alpha*0.12*(4-i)*(1-e);
    ctx.drawImage(l.img,l.x+DIR[0]*d2,l.y+DIR[1]*d2);
  }
  ctx.globalAlpha=alpha;
  ctx.drawImage(l.img,l.x+DIR[0]*dist,l.y+DIR[1]*dist);
  ctx.globalAlpha=1;
}

function drawPop(l,p,glint,color){
  if(p<=0) return; if(p>=1){plain(l);return;}
  const s=Math.max(0,eOutBack(p)), cx=l.cx, cy=l.cy;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(s,s); ctx.translate(-cx,-cy);
  ctx.globalAlpha=clamp(p*3); plain(l); ctx.restore();
  const r0=(l.core[2]-l.core[0])/2+1, a=Math.sin(Math.PI*p);
  if(glint){ // scintillement en croix
    const len=r0*(2.2+3.2*a);
    ctx.save(); ctx.translate(cx,cy); ctx.rotate(rad(45*p));
    ctx.fillStyle=`rgba(20,22,29,${a*0.9})`;
    for(let k=0;k<2;k++){ctx.beginPath();ctx.moveTo(-len,0);ctx.quadraticCurveTo(0,-1.6,len,0);ctx.quadraticCurveTo(0,1.6,-len,0);ctx.fill();ctx.rotate(Math.PI/2);}
    ctx.restore();
  }
  const R=r0*(1.4+4*p), g=ctx.createRadialGradient(cx,cy,r0*.6,cx,cy,R);
  g.addColorStop(0,color.replace('A',a*0.55)); g.addColorStop(1,color.replace('A',0));
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
}

function render(t){
  ctx.clearRect(0,0,D.W,D.H);
  const arcP=eInOut(prog(t,ARC.start,ARC.dur));
  drawArc(L.arcUp,D.upA[0],D.upA[1],arcP,t<AST.start+AST.dur?t:0);
  drawArc(L.arcDown,D.dnA[0],D.dnA[1],arcP);
  LETTERS.forEach((n,i)=>drawLetter(L[n],prog(t,LET.start+i*LET.stagger,LET.dur)));
  drawAsteroid(t);
  drawDebris(t);
  STAR_ORDER.forEach((n,i)=>drawPop(L[n],prog(t,STAR.start+i*STAR.stagger,STAR.dur),true,'rgba(20,22,29,A)'));
  drawPop(L.red,prog(t,RED.start,RED.dur),false,'rgba(255,40,40,A)');
}


  let onReadyCb=null, isReady=false;
  function ready(){ DEBRIS=makeDebris(); isReady=true; if(onReadyCb) onReadyCb(); }
  function play(){
    return new Promise(res=>{
      const go=()=>{ let t0=null, stop=false; const sp=document.getElementById('splash');
        const end=()=>{ sp.onclick=null; res(); };
        sp.onclick=()=>{ stop=true; render(T); end(); };
        function tick(now){ if(stop) return; if(t0===null) t0=now; const t=(now-t0)/1000; render(Math.min(t,T)); if(t<T+0.45) requestAnimationFrame(tick); else end(); }
        requestAnimationFrame(tick); };
      if(isReady) go(); else onReadyCb=go;
    });
  }
  return {play};
})();

async function runOpening(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches, sp=$('splash');
  if(reduce){ sp.hidden=true; document.documentElement.classList.remove('booting'); return; }
  {
    sp.hidden=false; sp.classList.remove('out'); document.documentElement.classList.add('booting');
    await Logo.play();
    sp.classList.add('out'); setTimeout(()=>{ sp.hidden=true; },650);
  }
  await playTrace();
}

function placeRibbon(){ const f=$('figure'), l=$('layout'); if(!f||!l) return; const fr=f.getBoundingClientRect(), lr=l.getBoundingClientRect();
  l.style.setProperty('--ry',(fr.top-lr.top+fr.height*.55)+'px'); }
window.addEventListener('resize',placeRibbon); if(window.ResizeObserver) new ResizeObserver(placeRibbon).observe($('layout'));
/* Démarrage : on arrive directement sur la fiche */
buildStatic();
const restored=Store.loadLocal(); if(restored) C=restored;
renderAll(); updateSaveState(); setupAutosave(); placeRibbon();
runOpening();
